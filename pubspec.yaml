name: scrapnote
description: "A local-first desktop workbench for turning scraps into notes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_map: ^8.3.2
  forui: ^0.25.0
  geolocator: ^14.0.3
  intl: ^0.20.2
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
